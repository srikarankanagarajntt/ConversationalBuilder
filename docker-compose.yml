services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: cv-builder-backend:latest
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      APP_ENV: production
      APP_PORT: 8000
      ALLOWED_ORIGINS: http://localhost:4200,http://localhost:8000
    volumes:
      - backend_exports:/app/exports
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: cv-builder-frontend:latest
    ports:
      - "4200:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_exports:
